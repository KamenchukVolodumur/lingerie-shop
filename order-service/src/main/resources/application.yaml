server:
  port: 8083

novaposhta:
  api:
    key: ${NOVAPOSHTA_API_KEY:}

app:
  services:
    cart-service-url: ${CART_SERVICE_URL:http://localhost:8082}
    product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8080}
    payment-service-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}

spring:
  application:
    name: order-service
  profiles:
    active: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/lingerie_orders}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: update # Дозволить Hibernate автоматично створювати таблиці під час навчання
    show-sql: true # Дозволить нам бачити згенеровані SQL-запити в консолі
    properties:
      hibernate:
        format_sql: true
