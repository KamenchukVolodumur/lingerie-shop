spring:
  application:
    name: product-service
  profiles:
    active: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/lingerie_products}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Дозволить Hibernate автоматично створювати таблиці під час навчання
    show-sql: true # Дозволить нам бачити згенеровані SQL-запити в консолі
    properties:
      hibernate:
        format_sql: true
app:
  seed:
    demo-catalog: true

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
