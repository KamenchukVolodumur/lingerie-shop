server:
  port: 8082

spring:
  application:
    name: cart-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

app:
  services:
    product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8080}

# F1-01: Redisson configuration for distributed locking
redisson:
  single-server-config:
    address: redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}

# F2-06: Resilience4j Circuit Breaker for ProductServiceClient
resilience4j:
  circuitbreaker:
    instances:
      productClient:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30000
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        minimum-number-of-calls: 5
  retry:
    instances:
      productClient:
        max-attempts: 3
        wait-duration: 2000
