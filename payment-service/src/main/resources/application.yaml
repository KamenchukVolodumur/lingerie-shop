server:
  port: 8084

spring:
  application:
    name: payment-service

  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5433/lingerie_payments
    username: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

app:
  services:
    order-service-url: ${ORDER_SERVICE_URL:http://localhost:8083}
  monobank:
    api-url: ${MONOBANK_API_URL:https://api.monobank.ua}
    token: ${MONOBANK_TOKEN}
    web-hook-url: ${MONOBANK_WEB_HOOK_URL}
    hold-expiration: ${MONOBANK_HOLD_EXPIRATION:PT24H}
    hold-expiration-check-interval: ${MONOBANK_HOLD_EXPIRATION_CHECK_INTERVAL:PT5M}
  urls:
    order-success-url: ${ORDER_SUCCESS_URL:http://localhost:5173/order-success}